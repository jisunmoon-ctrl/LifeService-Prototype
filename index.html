<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>prototypes — index</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #1e1e1e; color: #fff;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 32px; }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.02em; }
  p.sub { margin: 0 0 24px; font-size: 13px; color: #999; }
  a.card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 8px;
    background: #2d2d2d; border: 1px solid #404040; border-radius: 12px; color: #fff;
    text-decoration: none; transition: background 0.15s, border-color 0.15s; }
  a.card:hover { background: #363636; border-color: #0aa5ff; }
  a.card.primary { background: #0aa5ff; border-color: #0aa5ff; }
  a.card.primary:hover { background: #0b93e3; }
  .t { flex: 1; }
  .t b { display: block; font-size: 14px; font-weight: 700; }
  .t span { font-size: 12px; color: #bbb; }
  a.card.primary .t span { color: rgba(255,255,255,0.85); }
  .port { font-size: 11px; font-variant-numeric: tabular-nums; color: #888; }
  a.card.primary .port { color: rgba(255,255,255,0.85); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #666; flex-shrink: 0; }
  .dot.up { background: #22c55e; } .dot.down { background: #ef4444; }
  footer { margin-top: 20px; font-size: 12px; color: #777; line-height: 1.7; }
  code { background: #2d2d2d; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<main>
  <h1>prototypes</h1>
  <p class="sub">오늘의집 이사 서비스 프로토타입 — 프리뷰 진입점</p>

  <a class="card primary" href="http://localhost:5180/" data-check="http://localhost:5180/">
    <span class="dot" id="d0"></span>
    <span class="t"><b>통합 프리뷰 허브</b><span>3개 프로토타입의 모든 플로우를 하나의 우측 패널에서 전환</span></span>
    <span class="port">:5180</span>
  </a>

  <a class="card" href="http://localhost:5181/form-prototype.html" data-check="http://localhost:5181/form-prototype.html">
    <span class="dot" id="d1"></span>
    <span class="t"><b>form</b><span>시공신청 크로스셀링 · 견적신청퍼널 · 이사 · 이사청소</span></span>
    <span class="port">:5181</span>
  </a>

  <a class="card" href="http://localhost:5182/movingHome-prototype.html" data-check="http://localhost:5182/movingHome-prototype.html">
    <span class="dot" id="d2"></span>
    <span class="t"><b>movingHome</b><span>이사홈 (홈 · 콘텐츠 상세 · 견적 신청)</span></span>
    <span class="port">:5182</span>
  </a>

  <a class="card" href="http://localhost:5183/movingpartner-prototype.html" data-check="http://localhost:5183/movingpartner-prototype.html">
    <span class="dot" id="d3"></span>
    <span class="t"><b>movingpartner</b><span>책임보장 견적 발송(B2B) · 견적 계약(B2C)</span></span>
    <span class="port">:5183</span>
  </a>

  <footer>
    dev 서버 상태를 5초마다 확인합니다. 꺼져 있으면 Cursor 에서
    <code>Cmd+Shift+B</code> → <code>preview: 전체 실행</code>.
  </footer>
</main>

<script>
  const cards = Array.from(document.querySelectorAll('a.card'));
  function check() {
    cards.forEach((card, i) => {
      const dot = document.getElementById('d' + i);
      fetch(card.dataset.check, { mode: 'no-cors', cache: 'no-store' })
        .then(() => { dot.className = 'dot up'; })
        .catch(() => { dot.className = 'dot down'; });
    });
  }
  check();
  setInterval(check, 5000);
</script>
</body>
</html>
